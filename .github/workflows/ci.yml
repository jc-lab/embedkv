name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Go ───────────────────────────────────────────────────────────────────
  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./go/...

      - name: test
        run: go test -race -count=1 -timeout=120s ./go/...
        # Note: TestGenerateFixtures runs as part of go test and writes to testdata/.
        # Uploading the result lets the Rust job verify against Go's fresh binary output.

      - name: Upload testdata fixtures
        uses: actions/upload-artifact@v4
        with:
          name: testdata
          path: testdata/
          retention-days: 1

  # ── Rust ─────────────────────────────────────────────────────────────────
  rust:
    name: Rust
    runs-on: ubuntu-latest
    needs: go

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Replace committed fixtures with the ones freshly generated by the Go job.
      # This enforces that Rust always verifies against Go's current binary output,
      # catching format divergence even when committed fixtures happen to be stale.
      - name: Download fixtures from Go job
        uses: actions/download-artifact@v4
        with:
          name: testdata
          path: testdata/

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -- -D warnings

      - name: test
        run: cargo test
